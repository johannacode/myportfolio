<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradientRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E63946;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FA8072;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FA8072;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA07A;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Forme de livre ouvert stylisée intégrant le J -->
  <path d="M 60 80 Q 60 50, 80 50 L 100 50 L 100 130 Q 85 125, 70 130 Q 60 132, 60 120 Z" 
        fill="url(#gradientRed)" opacity="0.3"/>
  
  <!-- Forme de livre côté droit intégrant le A -->
  <path d="M 100 50 L 120 50 Q 140 50, 140 80 L 140 120 Q 140 132, 130 130 Q 115 125, 100 130 Z" 
        fill="url(#gradientRed)" opacity="0.3"/>
  
  <!-- Lettre J stylisée avec élément code -->
  <g>
    <path d="M 70 60 L 70 105 Q 70 115, 78 115 Q 85 115, 85 108" 
          stroke="url(#gradientRed)" 
          stroke-width="6" 
          fill="none" 
          stroke-linecap="round"/>
    
    <!-- Point sur le J façon pixel -->
    <rect x="67" y="48" width="6" height="6" fill="url(#accentGradient)"/>
  </g>
  
  <!-- Lettre A stylisée avec élément technologique -->
  <g>
    <path d="M 110 115 L 122 60 L 134 115" 
          stroke="url(#gradientRed)" 
          stroke-width="6" 
          fill="none" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    
    <!-- Barre du A façon code -->
    <line x1="115" y1="92" x2="129" y2="92" 
          stroke="url(#accentGradient)" 
          stroke-width="5" 
          stroke-linecap="round"/>
  </g>
  
  <!-- Éléments de code stylisés -->
  <text x="50" y="145" font-family="monospace" font-size="16" fill="url(#gradientRed)" opacity="0.6">&lt;/&gt;</text>
  <text x="135" y="145" font-family="monospace" font-size="16" fill="url(#accentGradient)" opacity="0.6">{}</text>
  
  <!-- Détails pixelisés évoquant l'informatique -->
  <rect x="145" y="70" width="4" height="4" fill="url(#accentGradient)" opacity="0.7"/>
  <rect x="145" y="78" width="4" height="4" fill="url(#accentGradient)" opacity="0.5"/>
  <rect x="51" y="70" width="4" height="4" fill="url(#gradientRed)" opacity="0.7"/>
  <rect x="51" y="78" width="4" height="4" fill="url(#gradientRed)" opacity="0.5"/>
</svg>